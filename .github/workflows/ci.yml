name: GameStats CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-go:
    name: Build & vet Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: go vet
        working-directory: go-ingestion
        run: go vet ./...
      - name: go build
        working-directory: go-ingestion
        run: go build ./...

  build-scala:
    name: Build & test Scala
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: sbt/setup-sbt@v1
      - name: sbt compile
        working-directory: scala-analysis
        run: sbt compile

  docker-images:
    name: Build imágenes Docker
    runs-on: ubuntu-latest
    needs: [build-go, build-scala]
    steps:
      - uses: actions/checkout@v4
      - name: Build imagen Go
        run: docker build -t gamestats-ingestion:${{ github.sha }} ./go-ingestion
      - name: Build imagen Scala
        run: docker build -t gamestats-analysis:${{ github.sha }} ./scala-analysis
      # Push/deploy: agregar aquí el paso hacia el registro y entorno
      # de despliegue elegido por el equipo (sección 10 del enunciado).
